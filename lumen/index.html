    <meta name="description" content="LUMEN — orbituj iskrą wokół rdzenia, zbieraj światło, rozbijaj jasne strony, unikaj ciemnych." />
    <meta name="theme-color" content="#07020c" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!--STARTUP_IMAGES-->
    <script>
      // Android gets a portrait-locked manifest; iPad keeps both orientations.
      (function () {
        var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var l = document.createElement('link');
        l.rel = 'manifest';
        l.href = ios ? 'manifest-ios.webmanifest' : 'manifest.webmanifest';
        document.head.appendChild(l);
      })();
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #07020c; overflow: hidden; }
    </style>
  </head>
  <body>
    <canvas id="gl" tabindex="-1" aria-label="LUMEN"></canvas>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
